<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AI automation builder: Python, Claude API, and reviewable workflow automation.">
  <title>Erald Almoete | AI Automation</title>
  <style>
    :root, [data-theme="light"] {
      --bg: #f7f8fa; --surface: #ffffff; --text: #1a1d23; --muted: #5b6270;
      --border: #e2e5ea; --accent: #2b59c3; --accent-text: #ffffff;
      --accent-soft: #e8efff; --shadow: rgba(0,0,0,0.06);
    }
    [data-theme="dark"] {
      --bg: #0f1115; --surface: #171a21; --text: #e7e9ee; --muted: #9aa3b2;
      --border: #272c36; --accent: #7ea6ff; --accent-text: #0f1115;
      --accent-soft: #1d2638; --shadow: rgba(0,0,0,0.4); color-scheme: dark;
    }
    [data-theme="ocean"] {
      --bg: #0b1f2a; --surface: #11303f; --text: #e6f4f8; --muted: #9fc3cf;
      --border: #1f4658; --accent: #3ed1c0; --accent-text: #05202a;
      --accent-soft: #163d4e; --shadow: rgba(0,0,0,0.35); color-scheme: dark;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        --bg: #0f1115; --surface: #171a21; --text: #e7e9ee; --muted: #9aa3b2;
        --border: #272c36; --accent: #7ea6ff; --accent-text: #0f1115;
        --accent-soft: #1d2638; --shadow: rgba(0,0,0,0.4); color-scheme: dark;
      }
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.6;
      transition: background 0.2s, color 0.2s;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px; }

    header.site {
      position: sticky; top: 0; z-index: 10;
      background: var(--surface); border-bottom: 1px solid var(--border);
    }
    header.site .wrap {
      display: flex; align-items: center; justify-content: space-between;
      height: 60px; gap: 16px;
    }
    .brand { font-weight: 700; color: var(--text); }
    .header-right { display: flex; align-items: center; gap: 20px; }
    nav { display: flex; gap: 20px; }
    nav a { color: var(--muted); font-size: 0.95rem; }
    nav a:hover { color: var(--text); text-decoration: none; }

    .theme-switch {
      display: inline-flex; border: 1px solid var(--border);
      border-radius: 999px; padding: 3px; background: var(--bg);
    }
    .theme-switch button {
      font: inherit; font-size: 0.8rem; cursor: pointer;
      background: transparent; color: var(--muted);
      border: 0; border-radius: 999px; padding: 4px 10px;
    }
    .theme-switch button:hover { color: var(--text); }
    .theme-switch button[aria-pressed="true"] {
      background: var(--accent); color: var(--accent-text); font-weight: 600;
    }
    .theme-switch button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .hero { padding: 72px 0 40px; }
    .hero h1 { font-size: clamp(2.2rem, 5vw, 3rem); margin: 0 0 8px; letter-spacing: -0.02em; }
    .role { font-size: 1.15rem; color: var(--accent); font-weight: 600; margin: 0 0 16px; }
    .summary { color: var(--muted); max-width: 680px; margin: 0 0 24px; }
    .badges { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; }
    .badge {
      background: var(--accent-soft); color: var(--accent);
      padding: 4px 12px; border-radius: 999px; font-size: 0.85rem; font-weight: 500;
    }
    .cta { display: flex; flex-wrap: wrap; gap: 12px; }
    .btn {
      display: inline-block; padding: 10px 18px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--surface); color: var(--text);
      font-weight: 600; font-size: 0.95rem;
    }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
    .btn:hover { text-decoration: none; opacity: 0.9; }

    section { padding: 40px 0; }
    section h2 { font-size: 1.5rem; margin: 0 0 20px; letter-spacing: -0.01em; }
    .panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 28px; color: var(--muted);
    }

    .grid {
      display: grid; gap: 20px;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 24px;
      display: flex; flex-direction: column;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px var(--shadow); }
    .card h3 { margin: 0 0 8px; font-size: 1.15rem; }
    .card p { margin: 0 0 16px; color: var(--muted); font-size: 0.97rem; flex-grow: 1; }
    .tools { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
    .tool {
      font-size: 0.78rem; color: var(--muted);
      border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px;
    }
    .links { display: flex; gap: 14px; font-weight: 600; font-size: 0.92rem; }

    .skills { display: flex; flex-wrap: wrap; gap: 8px; }
    .skill {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 6px 12px; font-size: 0.92rem;
    }

    .contact {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 28px;
      display: flex; flex-wrap: wrap; justify-content: space-between;
      gap: 16px; align-items: center;
    }
    .contact p { margin: 0; color: var(--muted); }

    footer {
      padding: 32px 0 48px; color: var(--muted);
      font-size: 0.9rem; text-align: center;
    }

    @media (max-width: 640px) {
      nav { display: none; }
      .hero { padding: 48px 0 24px; }
    }
  </style>
</head>
<body>

  <header class="site">
    <div class="wrap">
      <a class="brand" href="#top" id="brand"></a>
      <div class="header-right">
        <nav id="nav"></nav>
        <div class="theme-switch" id="theme-switch" role="group" aria-label="Choose theme"></div>
      </div>
    </div>
  </header>

  <main id="top" class="wrap">
    <div class="hero" id="hero"></div>
    <section id="about"></section>
    <section id="projects"></section>
    <section id="skills"></section>
    <section id="contact"></section>
  </main>

  <footer>
    <div class="wrap" id="footer"></div>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
